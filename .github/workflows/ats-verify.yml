name: ATS Verification

on:
  pull_request:
    paths:
      - "resume.json"
      - "cv/**"
      - "scripts/verify-ats.js"
      - ".github/workflows/ats-verify.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-ats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install poppler (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Setup Typst
        uses: typst-community/setup-typst@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile CV
        run: npm run generate:pdf

      - name: Run ATS verification
        id: ats
        run: npm run verify:ats

      - name: Comment on PR with ATS report
        if: always() && steps.ats.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ats-verify-comment -->';
            const outcome = '${{ steps.ats.outcome }}';

            let reportBody = '';
            try {
              reportBody = fs.readFileSync('cv/output/ats-report.md', 'utf8');
            } catch {
              reportBody = '_No report generated — check the workflow logs._';
            }

            const body = [
              marker,
              `## ${outcome === 'success' ? '🤖✅' : '🤖❌'} ATS Verification`,
              '',
              `Result for commit \`${context.payload.pull_request.head.sha.slice(0, 7)}\`:`,
              '',
              reportBody,
              `_Checks every pdf-visible resume.json field against the PDF text layer (pdftotext). Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
