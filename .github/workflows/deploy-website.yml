name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "resume.json"
      - "website/**"
      - "scripts/generate-website.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate website
        run: npm run generate:website

      - name: Add CNAME and .nojekyll
        run: |
          echo "cristianabrante.com" > website/output/CNAME
          touch website/output/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: website/output
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
