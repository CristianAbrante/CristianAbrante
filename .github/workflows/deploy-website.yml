name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "resume.json"
      - "website/**"
      - "scripts/generate-website.js"
      - "cv/**"
      - "mise.toml"
  workflow_dispatch: # Allow manual trigger

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup toolchain (mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: node typst

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Cache Typst packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/typst/packages
          key: ${{ runner.os }}-typst-packages-${{ hashFiles('cv/cv.typ') }}
          restore-keys: ${{ runner.os }}-typst-packages-

      - name: Install dependencies
        run: npm ci

      # Must run before generate:website, which copies the compiled PDF into the
      # site so the hero's download button resolves.
      - name: Compile PDF CV
        run: npm run generate:pdf

      - name: Generate website from resume.json
        run: npm run generate:website

      - name: Add .nojekyll file
        run: touch website/output/.nojekyll

      - name: Add CNAME file for custom domain
        run: echo "cristianabrante.com" > website/output/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website/output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
