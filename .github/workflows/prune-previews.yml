name: Prune Preview Deployments

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting it"
        type: boolean
        default: true
      max_age_days:
        description: "Delete preview deployments older than this many days"
        type: string
        default: "30"
  pull_request:
    paths:
      - "scripts/prune-previews.js"
      - ".github/workflows/prune-previews.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: prune-previews
  cancel-in-progress: false

env:
  CF_PAGES_PROJECT: cristianabrante-preview

jobs:
  prune:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect branches of open pull requests
        id: keep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCHES=$(gh pr list --state open --limit 200 --json number \
            --jq '[.[] | "pr-\(.number)"] | join(",")')
          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"
          echo "Protecting: ${BRANCHES:-(none)}"

      - name: Prune preview deployments
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '30' }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
          KEEP: ${{ steps.keep.outputs.branches }}
        run: |
          # Fail safe: delete only on the schedule, or on a manual run that
          # explicitly asked for it. Any other trigger stays a dry run.
          LIVE=false
          if [ "$EVENT" = "schedule" ]; then LIVE=true; fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN_INPUT" = "false" ]; then LIVE=true; fi

          ARGS=(--project "$CF_PAGES_PROJECT" --max-age-days "$MAX_AGE_DAYS" --keep "$KEEP")
          if [ "$LIVE" != "true" ]; then ARGS+=(--dry-run); fi
          node scripts/prune-previews.js "${ARGS[@]}"
