name: Sync Resume Formats

on:
  push:
    branches:
      - master
    paths:
      - "resume.json"
  workflow_dispatch:

jobs:
  generate-resume-formats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: latest

      - name: Install poppler-utils (for ATS validation)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: npm ci

      - name: Generate README, Typst CV, and Website
        run: |
          npm run generate:readme
          npm run generate:cv
          npm run generate:website

      - name: Compile PDF
        run: npm run generate:pdf

      - name: Validate ATS compatibility
        run: npm run validate:ats

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet README.md website/ cv/typst/cv.typ cv/typst/cv.pdf; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes if any
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md website/output/ cv/typst/cv.typ cv/typst/cv.pdf
          git commit -m "chore: auto-update generated formats from resume.json [skip ci]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Get version
        id: get_version
        run: |
          VERSION=$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-${{ steps.get_version.outputs.version }}
          path: cv/typst/cv.pdf
          retention-days: 90

      - name: Create Release with PDF
        uses: softprops/action-gh-release@v1
        with:
          tag_name: cv-${{ steps.get_version.outputs.version }}
          name: CV - ${{ steps.get_version.outputs.version }}
          body: |
            Auto-generated CV from resume.json (Typst + basic-resume, ATS-validated).

            **Generated:** ${{ steps.get_version.outputs.version }}
            **Commit:** ${{ github.sha }}
          files: cv/typst/cv.pdf
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
